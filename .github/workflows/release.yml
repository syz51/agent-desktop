# On a `v*` tag: build `desktop` and `desktopd` for Linux (x86_64 and aarch64) and macOS
# (Apple silicon and Intel), publish checksummed archives to a GitHub Release with build
# provenance attestation.
#
# A pull request that changes this workflow runs it as a dry run: every build, nothing published.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Publish only from a version tag; pull requests stop after building and packaging.
  PUBLISH: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Cross-compiled on Apple silicon; the smoke test runs under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      # No build cache: a release is built from scratch, so nothing cached by another ref
      # can reach it.
      - name: Build desktop and desktopd
        run: cargo build --release --locked --bin desktop --bin desktopd --target "$TARGET"
      - name: Smoke test and package
        shell: bash
        run: |
          set -euo pipefail
          cli="target/$TARGET/release/desktop"
          daemon="target/$TARGET/release/desktopd"
          version="$("$cli" --version | awk '{print $2}')"
          daemon_version="$("$daemon" --version | awk '{print $2}')"
          if [[ "$version" != "$daemon_version" ]]; then
            echo "::error::desktop ($version) and desktopd ($daemon_version) versions differ"
            exit 1
          fi
          if [[ "$PUBLISH" == true && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          name="agent-desktop-$version-$TARGET"
          mkdir -p "staging/$name" out
          cp "$cli" "$daemon" LICENSE README.md "staging/$name/"
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp packaging/linux/desktopd.service packaging/linux/desktopd-xvfb.service "staging/$name/"
          fi
          COPYFILE_DISABLE=1 tar -czf "out/$name.tar.gz" -C staging "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-desktop-${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    needs: [binaries]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-desktop-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" != *-* ]] || prerelease=(--prerelease)
          notes="Verify a download with \`shasum -a 256 --check --ignore-missing SHA256SUMS\`,
          \`gh release verify-asset $TAG <archive> --repo $GH_REPO\`, and
          \`gh attestation verify <archive> --repo $GH_REPO\`."
          # Passing all assets to `gh release create` uploads them to a temporary draft and
          # publishes atomically by release ID, so immutable releases freeze the complete set.
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes --notes "$notes" "${prerelease[@]}"
          for attempt in {1..30}; do
            if gh release verify "$TAG" --repo "$GH_REPO"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::Timed out waiting for GitHub release attestation for $TAG"
              exit 1
            fi
            echo "Waiting for GitHub release attestation ($attempt/30)..." >&2
            sleep 5
          done
